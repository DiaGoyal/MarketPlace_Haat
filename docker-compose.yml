services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["15672:15672"]   # management UI -> guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build: ./services/auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth
      PORT: 4001
      MONGO_URL: mongodb://mongo:27017/auth_db
      RABBIT_URL: amqp://rabbitmq
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on: { mongo: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  catalogue:
    build: ./services/catalogue
    restart: unless-stopped
    environment:
      SERVICE_NAME: catalogue
      PORT: 4002
      MONGO_URL: mongodb://mongo:27017/catalogue_db
      RABBIT_URL: amqp://rabbitmq
    depends_on: { mongo: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  orders:
    build: ./services/orders
    restart: unless-stopped
    environment:
      SERVICE_NAME: orders
      PORT: 4003
      MONGO_URL: mongodb://mongo:27017/orders_db
      RABBIT_URL: amqp://rabbitmq
      CATALOGUE_URL: http://catalogue:4002
    depends_on: { mongo: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  payments:
    build: ./services/payments
    restart: unless-stopped
    environment:
      SERVICE_NAME: payments
      PORT: 4004
      MONGO_URL: mongodb://mongo:27017/payments_db
      RABBIT_URL: amqp://rabbitmq
    depends_on: { mongo: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  notifications:
    build: ./services/notifications
    restart: unless-stopped
    environment:
      SERVICE_NAME: notifications
      PORT: 4005
      MONGO_URL: mongodb://mongo:27017/notifications_db
      RABBIT_URL: amqp://rabbitmq
    depends_on: { mongo: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SERVICE_NAME: gateway
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [auth, catalogue, orders, payments, notifications]

  # automated test, run it with:  docker compose --profile test run --rm tests
  tests:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /tests
    volumes: ["./tests:/tests"]
    environment:
      BASE_URL: http://gateway:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: node smoke.js
    depends_on: [gateway]

volumes:
  mongo_data:
